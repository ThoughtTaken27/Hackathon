<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enter your Kettle code</title>
<meta name="theme-color" content="#FAFAF9">
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/geist-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css?v=h10">
<link rel="stylesheet" href="/css/theme.css?v=h10">
<link rel="stylesheet" href="/css/type.css?v=h10">
<script src="/js/chrome.js?v=w7" defer></script>
</head>
<body>
<nav class="nav" aria-label="Kettle"><div class="nav-in">
  <a class="mark" href="/"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="8" width="7.5" height="6" rx="3" fill="#eb6834"/><rect x="10" y="8" width="4" height="6" rx="2" fill="#1baf7a"/><rect x="15.5" y="8" width="5.5" height="6" rx="2.75" fill="#2a78d6"/></svg>Kettle</a>
</div></nav>
<main class="shell"><div class="narrow enter">
  <h1 class="h1">Enter your <em>code</em></h1>
  <p class="lead">Six letters and numbers, from the other screen. Spaces don't matter.</p>
  <div id="code-slot" style="margin-top:28px"></div>
  <p class="err" id="err" role="alert"></p>
  <div class="actions"><button class="btn primary lg" type="button" id="go">Connect</button><a class="btn lg" href="/start">Set up Kettle instead</a></div>
</div></main>
<script type="module">
import { $, api, saveHome, codeInput } from "/js/ui.js";
const go = async (code) => {
  $("#err").textContent = ""; $("#go").disabled = true; $("#go").textContent = "Connecting…";
  try { const r = await api("/api/pair", { method: "POST", body: { code } }); saveHome(r.id, { [r.role + "Key"]: r.key }); location.href = r.role === "kitchen" ? "/kitchen" : "/family"; }
  catch (e) { $("#err").textContent = e.message; ci.error(); $("#go").disabled = false; $("#go").textContent = "Connect"; ci.focus(); }
};
const ci = codeInput({ onComplete: go });
$("#code-slot").append(ci.node);
ci.input.addEventListener("input", () => { $("#err").textContent = ""; });
$("#go").addEventListener("click", () => ci.value().length === 6 ? ci.submit() : (($("#err").textContent = "Type all six letters and numbers."), ci.error()));
ci.focus();
</script>
</body>
</html>
